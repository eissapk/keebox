<script>
  import Tabs from "../ui/Tabs/Tabs";
  import TabsList from "../ui/Tabs/TabsList";
  import TabsTrigger from "../ui/Tabs/TabsTrigger";
  import TabsContent from "../ui/Tabs/TabsContent";
  import SectionHeading from "./SectionHeading";
  import CopyButton from "./CopyButton";

  // Each tab: commands (with a comment) and what the terminal prints back.
  const groups = [
    {
      id: "add",
      label: "Add",
      title: "keebox add",
      cmds: [
        ["keebox add --name google --username foo@gmail.com --url google.com", ""],
        ['keebox add --name github --username foo --url github.com --login foo@mail.com --notes "2FA via phone"', "login/notes are encrypted"],
      ],
      out: [
        ["muted", "? MASTER PASSWORD: ••••••••••••"],
        ["muted", "? Add password:  ••••••••••••••••"],
        ["ok", "[+] Added entry #12"],
      ],
    },
    {
      id: "find",
      label: "Find",
      title: "keebox get",
      cmds: [
        ["keebox get", "every account, as a table"],
        ["keebox get --id 12", "exact id"],
        ["keebox get --name git", "name, url or username, case-insensitive"],
      ],
      table: {
        cols: ["ID", "NAME", "URL", "USERNAME", "LOGIN", "NOTES", "CREATED", "UPDATED"],
        rows: [
          ["12", "github", "github.com", "foo", "***", "***", "02-11-2026", "-"],
          ["14", "gitlab", "gitlab.com", "foo", "-", "-", "05-11-2026", "-"],
        ],
      },
      out: [["dim", " 2 entries"]],
    },
    {
      id: "copy",
      label: "Copy & show",
      title: "keebox get",
      cmds: [
        ["keebox get --id 12 --cp", "password → clipboard"],
        ["keebox get --id 12 --show", "decrypted login/notes"],
      ],
      out: [
        ["muted", "? MASTER PASSWORD: ••••••••••••"],
        ["ok", "✓ Copied password of entry #12 to clipboard, clears in 20s"],
        ["dim", ""],
        ["amber", "login: foo@mail.com"],
        ["amber", "notes: 2FA via phone"],
        ["dim", ""],
        ["dim", "# on Android (Termux) the password is printed instead"],
      ],
    },
    {
      id: "edit",
      label: "Edit & delete",
      title: "keebox get",
      cmds: [
        ["keebox get --id 12 --edit", "Enter keeps a value, '-' clears it"],
        ["keebox get --id 14 --rm", "asks before it deletes"],
      ],
      out: [
        ["muted", "? Entry #12 github (foo) will be updated, Are you sure? Yes"],
        ["dim", "Enter = keep current value, '-' = clear it"],
        ["muted", "? New notes [***]: 2FA via app"],
        ["muted", "? New password (Enter = keep):"],
        ["amber", "[+] Updated entry #12"],
        ["amber", "[-] Deleted entry #14 gitlab (foo)"],
      ],
    },
    {
      id: "make",
      label: "Generate",
      title: "keebox make",
      cmds: [
        ["keebox make --size 24", "4 to 1024 characters"],
        ["keebox make --size 64", ""],
      ],
      out: [["ok", "Copied to clipboard (clears in 20s): r8$Tq2!mZ#vW6@kL9pN&e4Ys"]],
    },
    {
      id: "backup",
      label: "Export & check",
      title: "keebox export · import · check",
      cmds: [
        ["keebox export", "decrypted CSV, readable by you only"],
        ["keebox export --name google --out google.csv", "just the matches"],
        ["keebox import --file accounts.csv", "same columns, duplicates skipped"],
        ["keebox check", "read-only damage check"],
      ],
      out: [
        ["ok", "[+] Exported 14 entries to /home/you/keebox-export-2026-11-16.csv"],
        ["amber", "! This file is NOT encrypted, delete it when you're done with it."],
        ["dim", ""],
        ["ok", "✓ 14 entries checked, no damage found"],
      ],
    },
    {
      id: "recovery",
      label: "Recovery",
      title: "keebox recovery · recover · master",
      cmds: [
        ["keebox recovery", "create the 12-word phrase, shown once"],
        ["keebox recover", "lost credentials.json or forgot the password"],
        ["keebox master", "change the master password"],
      ],
      out: [
        ["amber", "! Write these 12 words down (in order) and keep them offline. They are shown only once."],
        ["dim", ""],
        ["muted", "   1. ••••••••    5. ••••••••    9. ••••••••"],
        ["muted", "   2. ••••••••    6. ••••••••   10. ••••••••"],
        ["dim", "   …"],
        ["dim", ""],
        ["ok", "✓ Recovery phrase confirmed."],
      ],
    },
  ];

  const tone = (t) =>
    ({
      ok: "text-ok",
      amber: "text-amber",
      muted: "text-foreground/80",
      dim: "text-muted-foreground/70",
    })[t];

  const all = (g) => g.cmds.map((c) => c[0]).join("\n");
  const PROMPT = "$";
</script>

<section id="commands" class="relative py-16 sm:py-24">
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <SectionHeading eyebrow="Commands" title="A handful of commands." subtitle="That's the whole tool." />

    <div class="mx-auto mt-12 max-w-4xl">
      <Tabs>
        <div class="flex overflow-x-auto pb-1 [scrollbar-width:none]">
          <TabsList class="mx-auto h-10 shrink-0 rounded-full border border-border bg-surface p-1">
            <for each="(g, i) of groups" key="g.id">
              <TabsTrigger group="kb-cmd" value="{g.id}" defaultChecked="{i === 0}" class="rounded-full px-3.5 text-[13px] has-checked:bg-amber has-checked:text-primary-foreground has-checked:shadow-none sm:px-4">
                {g.label}
              </TabsTrigger>
            </for>
          </TabsList>
        </div>

        <for each="g of groups" key="g.id">
          <TabsContent value="{g.id}" class="mt-6">
            <div class="panel !rounded-2xl">
              <div class="flex items-center justify-between gap-3 border-b border-border px-5 py-3">
                <span class="font-mono text-xs text-muted-foreground">{g.title}</span>
                <CopyButton text="{all(g)}" label="Copy commands" />
              </div>
              <div class="overflow-x-auto px-5 py-4 font-mono text-[13px] leading-7">
                <for each="c of g.cmds">
                  <p class="whitespace-pre"><span class="select-none text-amber">{PROMPT} </span>{c[0]}<if when="c[1]"><span class="text-muted-foreground/60">  # {c[1]}</span></if></p>
                </for>
              </div>
              <div class="overflow-x-auto rounded-b-2xl border-t border-dashed border-border bg-black/25 px-5 py-4 font-mono text-[13px] leading-6">
                <if when="g.table">
                  <table class="mb-1 overflow-hidden rounded-lg border-separate border-spacing-0 border border-border text-left">
                    <thead>
                      <tr><for each="(c, ci) of g.table.cols"><th class="border-b border-border px-3 py-1 font-medium text-amber {ci ? 'border-l' : ''}">{c}</th></for></tr>
                    </thead>
                    <tbody>
                      <for each="r of g.table.rows">
                        <tr><for each="(v, vi) of r"><td class="px-3 py-1 whitespace-nowrap {vi ? 'border-l border-border' : ''} {!vi ? 'text-amber' : v === '-' ? 'text-muted-foreground/60' : 'text-foreground/90'}">{v}</td></for></tr>
                      </for>
                    </tbody>
                  </table>
                </if>
                <for each="o of g.out">
                  <p class="min-h-6 whitespace-pre {tone(o[0])}">{o[1]}</p>
                </for>
              </div>
            </div>
          </TabsContent>
        </for>
      </Tabs>
    </div>
  </div>
</section>
