<script>
  import { onMount } from "olum";
  import Logo from "./Logo";
  import Anchor from "../ui/Anchor/Anchor";
  import Button from "../ui/Button/Button";
  import Icon from "../ui/Icon/Icon";
  import { nav } from "../../utils/site.js";
  import { arrowRight, menu, x } from "../../utils/icons.js";

  const state = { scrolled: false, open: false };

  const toggle = () => (state.open = !state.open);
  const close = () => (state.open = false);

  onMount(() => {
    const onScroll = () => {
      const s = window.scrollY > 12;
      if (s !== state.scrolled) state.scrolled = s;
    };
    const onKey = (e) => e.key === "Escape" && close();
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("keydown", onKey);
    };
  });
</script>

<header
  class="fixed inset-x-0 top-0 z-40 transition-[background-color,border-color,backdrop-filter] duration-300 {state.scrolled || state.open
    ? 'border-b border-border bg-background/75 backdrop-blur-xl'
    : 'border-b border-transparent'}"
>
  <nav class="mx-auto flex h-(--nav-height) max-w-6xl items-center justify-between px-4 sm:px-6" aria-label="Main">
    <a href="#top" aria-label="KeeBox home" onclick="close()"><Logo /></a>

    <ul class="hidden items-center gap-1 md:flex">
      <for each="item of nav" key="item.href">
        <li>
          <a href="{item.href}" class="rounded-md px-3 py-2 text-sm text-muted-foreground transition-colors hover:text-foreground">{item.label}</a>
        </li>
      </for>
    </ul>

    <div class="flex items-center gap-2">
      <Anchor href="#install" class="h-9 rounded-full px-4 font-semibold shadow-[0_0_24px_-6px_rgba(244,166,58,0.6)]">
        Get KeeBox <Icon icon="{arrowRight}" class="size-4" />
      </Anchor>
      <Button variant="ghost" size="icon" class="md:hidden" ariaLabel="{state.open ? 'Close menu' : 'Open menu'}" onclick="{toggle}">
        <Icon icon="{state.open ? x : menu}" class="size-5" />
      </Button>
    </div>
  </nav>

  <if when="state.open">
    <ul class="mx-auto flex max-w-6xl flex-col gap-1 px-4 pb-4 md:hidden">
      <for each="item of nav" key="item.href">
        <li>
          <a href="{item.href}" onclick="close()" class="block rounded-lg px-3 py-2.5 text-base text-muted-foreground hover:bg-muted hover:text-foreground">{item.label}</a>
        </li>
      </for>
    </ul>
  </if>
</header>
