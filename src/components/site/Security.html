<script>
  import Icon from "../ui/Icon/Icon";
  import Badge from "../ui/Badge/Badge";
  import SectionHeading from "./SectionHeading";
  import { keyRound, lockKeyhole, shieldCheck, fileJson, history, lifeBuoy, check, x } from "../../utils/icons.js";

  const flow = [
    { icon: keyRound, title: "Master password", note: "typed at a prompt" },
    { icon: shieldCheck, title: "scrypt + salt", note: "unlocks credentials.json" },
    { icon: lockKeyhole, title: "Vault key", note: "lives in memory only" },
    { icon: fileJson, title: "AES-256-GCM", note: "per password, login and note" },
  ];

  const points = [
    { icon: lifeBuoy, title: "12-word recovery phrase", text: "A BIP39 phrase (128 random bits + checksum) locks the same vault key into db.json. It's shown once and never saved." },
    { icon: keyRound, title: "Change the master password", text: "keebox master re-locks the same vault key, so db.json and your recovery phrase keep working untouched." },
    { icon: history, title: "Backups on every save", text: "Writes are atomic, and the previous version is kept as db.json.bak and credentials.json.bak." },
    { icon: shieldCheck, title: "Tamper-evident", text: "GCM authenticates every entry. A damaged or edited value is refused instead of decrypted into garbage." },
  ];

  // What gets you into the accounts (from the README)
  const access = [
    { have: "db.json + credentials.json + master password", ok: true, note: "normal use" },
    { have: "db.json + recovery phrase", ok: true, note: "keebox recover sets a new master password" },
    { have: "db.json + master password, no credentials.json", ok: false, note: "restore credentials.json.bak or a backup" },
    { have: "db.json alone", ok: false, note: "for anyone: a 128-bit phrase or 256-bit key to guess" },
  ];
</script>

<section id="security" class="relative py-16 sm:py-24">
  <div aria-hidden="true" class="pointer-events-none absolute inset-x-0 top-1/3 -z-10 mx-auto h-[420px] max-w-4xl rounded-[50%] bg-[radial-gradient(closest-side,rgba(244,166,58,0.08),transparent)]"></div>
  <div class="mx-auto max-w-6xl px-4 sm:px-6">
    <SectionHeading eyebrow="Security" title="Encrypted before it touches disk." subtitle="Unlocked only while you need it." />

    <ol class="mt-14 grid gap-3 md:grid-cols-4 md:gap-0">
      <for each="(step, i) of flow" key="step.title">
        <li class="relative flex items-center gap-4 md:flex-col md:text-center">
          <if when="i > 0">
            <span aria-hidden="true" class="absolute top-7 right-1/2 hidden h-px w-full bg-gradient-to-r from-amber/10 via-amber/50 to-amber/10 md:block"></span>
          </if>
          <span class="relative grid size-14 shrink-0 place-items-center rounded-2xl border border-amber/30 bg-surface text-amber shadow-[0_0_30px_-8px_rgba(244,166,58,0.5)]">
            <Icon icon="{step.icon}" class="size-6" />
          </span>
          <div class="md:mt-4 md:px-3">
            <p class="font-mono text-[11px] tracking-wider text-amber/80">0{i + 1}</p>
            <p class="font-display text-base font-semibold">{step.title}</p>
            <p class="text-sm text-muted-foreground">{step.note}</p>
          </div>
        </li>
      </for>
    </ol>

    <div class="mt-14 grid gap-4 md:grid-cols-2 lg:grid-cols-4">
      <for each="p of points" key="p.title">
        <div class="panel p-6">
          <Icon icon="{p.icon}" class="size-5 text-amber" />
          <h3 class="mt-4 font-display text-[17px] font-semibold">{p.title}</h3>
          <p class="mt-1.5 text-sm leading-relaxed text-muted-foreground">{p.text}</p>
        </div>
      </for>
    </div>

    <div class="panel mx-auto mt-10 max-w-3xl overflow-hidden !rounded-2xl">
      <div class="border-b border-border px-5 py-3 font-mono text-xs text-muted-foreground">What opens your vault</div>
      <ul>
        <for each="(a, ai) of access" key="a.have">
          <li class="flex items-start gap-3 px-5 py-3 text-sm {ai ? 'border-t border-border' : ''}">
            <Icon icon="{a.ok ? check : x}" class="mt-0.5 size-4 shrink-0 {a.ok ? 'text-ok' : 'text-destructive'}" />
            <div class="min-w-0 flex-1 sm:flex sm:items-baseline sm:justify-between sm:gap-4">
              <code class="font-mono text-[13px] text-foreground/90">{a.have}</code>
              <p class="text-muted-foreground sm:text-right">{a.note}</p>
            </div>
          </li>
        </for>
      </ul>
    </div>

    <p class="mx-auto mt-8 flex max-w-2xl flex-wrap items-center justify-center gap-2 text-center text-sm text-muted-foreground">
      <Badge variant="outline" class="border-amber/30 text-amber">Heads up</Badge>
      Lose both the master password and the recovery phrase, and the vault can't be opened &mdash; by you, or anyone else.
    </p>
  </div>
</section>
